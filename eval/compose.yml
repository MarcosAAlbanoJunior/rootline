# Used by `rootline-eval record`. Ports and the collector output dir come from the environment.
services:
  # The external HTTP service of the scenarios whose cause is a slower call (ADR-0031).
  stub:
    image: rootline-eval-stub
    build: ./stub
    ports: ["${ROOTLINE_STUB_PORT:-58090}:8090"]
  postgres:
    image: postgres:19.0
    environment:
      POSTGRES_PASSWORD: rootline
      POSTGRES_DB: shop
    ports: ["${ROOTLINE_PG_PORT:-55432}:5432"]
  otelcol:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otelcol.yaml:/etc/otelcol/config.yaml:ro,Z
      - ${ROOTLINE_COLLECTOR_OUT:-./out}:/out:Z
    ports: ["${ROOTLINE_OTLP_PORT:-54318}:4318"]
